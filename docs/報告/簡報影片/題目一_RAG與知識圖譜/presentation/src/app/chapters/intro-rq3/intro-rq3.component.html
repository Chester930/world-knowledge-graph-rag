<div class="scene r3-scene">
  <div class="scene-pad r3-pad">

    <section class="r3-block" [class.r3-active]="step() === 0">
      <div class="r3-badge mono">RQ3</div>
      <p class="r3-kicker mono">核心研究問題</p>
      <h2 class="serif-cn">低信心觸發的自我精煉迴圈，<br />能不能降低幻覺率？</h2>
      <p class="r3-simplified">簡化說法：答案不確定的時候，回補原文再回答，是不是更可靠？</p>
    </section>

    <section class="r3-block" [class.r3-active]="step() >= 1">
      <div class="r3-badge mono">RQ3</div>
      <div class="r3-stack">
        <div class="r3-row" [attr.data-state]="step() >= 1 ? 'active' : 'hidden'">
          <span class="r3-row-label mono">理論基礎</span>
          <span class="r3-row-text serif-it">Asai et al. (2023) — Self-RAG</span>
        </div>
        <div class="r3-row" [attr.data-state]="step() >= 2 ? 'active' : 'hidden'">
          <span class="r3-row-label mono">實踐基礎</span>
          <span class="r3-row-text">Self-RAG 官方實作</span>
        </div>
        <div class="r3-row" [attr.data-state]="step() >= 2 ? 'active' : 'hidden'">
          <span class="r3-row-label mono">本專案落點</span>
          <span class="r3-row-text">agent router ＋ 實驗可追溯性規範</span>
        </div>
      </div>
    </section>
  </div>
</div>
